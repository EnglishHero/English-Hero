<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGLISH HERO</title>
<link id="fav" rel="icon" href="data:,">
<style>
:root{--g:#14532d;--g2:#1c6b3c;--gl:#eaf4ed;--bg:#f2f6f3;--line:#dde6df;--tx:#1b2a21;--mut:#66756b;--ok:#14703a;--bad:#c0261b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
header{background:linear-gradient(90deg,#0e3f24,#14532d 60%,#1c6b3c);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(14,63,36,.25)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #fff}
.brand b{letter-spacing:.14em;font-size:18px}
.pill{background:rgba(255,255,255,.16);padding:5px 12px;border-radius:20px;font-size:14px;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill:empty{display:none}
main{max-width:780px;margin:0 auto;padding:22px 16px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,83,45,.06)}
h1{font-size:30px;line-height:1.2;margin:.3em 0}h2{font-size:22px;margin:.2em 0 .7em}h3{font-size:18px;margin:.2em 0 .4em}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px 24px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;box-shadow:0 2px 8px rgba(20,83,45,.25)}
.btn:hover{background:var(--g2);transform:translateY(-1px)}.btn:disabled{opacity:.5;transform:none}
.btn.alt{background:#fff;color:var(--g);border:1.5px solid var(--g);box-shadow:none}.btn.alt:hover{background:var(--gl)}
.btn.full{width:100%}
input[type=text],select,textarea{width:100%;padding:12px 14px;border:1.5px solid #c5d0c8;border-radius:12px;font:inherit;background:#fff;transition:.15s}
input[type=text]:focus,select:focus,textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px rgba(28,107,60,.15)}
textarea{min-height:100px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.hero{text-align:center;padding:40px 16px 48px;background:linear-gradient(180deg,#fff,var(--gl));border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 40px rgba(20,83,45,.1)}
.herologo{width:180px;height:180px;border-radius:50%;box-shadow:0 8px 30px rgba(20,83,45,.2)}
.hero p{color:var(--mut);margin:0}
.hero .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--gl);color:var(--g)}
.tag.warn{background:#fff3d6;color:#7a5200}
.q{padding:14px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.qt{white-space:pre-wrap;margin-bottom:8px}
.opt{display:block;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer;transition:.15s}
.opt:hover{border-color:#9fb8a7}.opt:has(input:checked){border-color:var(--g);background:var(--gl)}
.opt input{margin-right:10px}
.txt{background:#f4f8f5;border-left:4px solid var(--g);padding:14px 16px;border-radius:8px;white-space:pre-wrap;margin:12px 0}
.chip{display:inline-block;padding:9px 14px;margin:4px;border:1.5px solid var(--g);border-radius:10px;background:#fff;cursor:pointer;font-weight:500}
.chip.used{opacity:.3;pointer-events:none}.chosen{min-height:50px;border:2px dashed #9fb3a5;border-radius:12px;padding:4px;margin-bottom:8px}.chosen .chip{background:var(--gl)}
input[type=text].gap{display:inline-block;width:150px;max-width:100%;padding:3px 8px;margin:0 3px;border:0;border-bottom:2px solid var(--g);border-radius:0;background:var(--gl);box-shadow:none}
.cloze{white-space:pre-wrap;line-height:2.4;margin:10px 0}
.big{font-size:56px;font-weight:800;color:var(--g);line-height:1.1}
img.pic{max-width:100%;border-radius:10px;margin:10px 0}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.bar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,transparent);padding:14px 0 10px}
.prog{height:8px;background:#dbe5de;border-radius:8px;overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;width:0;background:var(--g2);transition:.2s}
/* review */
.a{display:inline-block;padding:1px 9px;border-radius:7px;font-weight:700;margin:0 2px}
.a.ok{background:#e1f4e7;color:var(--ok);border:1.5px solid #8fd0a8}
.a.bad{background:#fde1de;color:var(--bad);border:1.5px solid #ee9a93;min-width:44px}.a.bad s{text-decoration-thickness:2px}
.a.fix{background:var(--ok);color:#fff;border:1.5px solid var(--ok)}
.a.man{background:#fff3d6;color:#7a5200;border:1.5px solid #ecd08a}
.ro{padding:9px 14px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0}
.ro.ok{background:#e1f4e7;border-color:#8fd0a8;color:var(--ok);font-weight:700}
.ro.bad{background:#fde1de;border-color:#e5857d;color:var(--bad);font-weight:700}
.ro.fix{background:#fff;border:2px solid var(--ok);color:var(--ok);font-weight:700}
.ro.man{background:#fff3d6;border-color:#ecd08a}
.ansrow{margin-top:6px}
.sum{text-align:center}.legend{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fc{background:#fff;border:1px solid var(--line);border-radius:20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;margin:16px 0;cursor:pointer;gap:10px;box-shadow:0 8px 30px rgba(20,83,45,.1)}
.fcw{font-size:30px;font-weight:700;color:var(--g)}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:9px 0;cursor:pointer;font:inherit;transition:.15s}
.mode b{font-size:17px}.mode span{color:var(--mut);font-size:14px}.mode:hover{border-color:var(--g);background:var(--gl);transform:translateY(-1px)}
.spk{border:0;background:var(--gl);border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;transition:.15s}.spk:hover{background:#d4e9da}.spk.big{width:84px;height:84px;font-size:38px}
.tile{display:block;width:100%;padding:13px 14px;margin:7px 0;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;cursor:pointer;text-align:center;transition:.15s}
.tile.left{text-align:left}.tile:hover{border-color:#9fb8a7}.tile.sel{border-color:var(--g);background:var(--gl);font-weight:600}
.tile.done{background:#e1f4e7;border-color:#8fd0a8;color:var(--ok);opacity:.65;pointer-events:none}
.tile.ok{background:#e1f4e7;border-color:#8fd0a8;color:var(--ok);font-weight:700}.tile.bad{background:#fde1de;border-color:#e5857d;color:var(--bad);font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){h1{font-size:25px}.herologo{width:140px;height:140px}.brand b{font-size:15px}}
</style>
</head>

const $ = id => document.getElementById(id);
$('hl').src = LOGO; $('fav').href = LOGO;

const S = { name: '', group: '', list: [], decks: [], task: null, ans: {}, ord: {}, total: 0 };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* <b>, <i>, <u> дозволені, усе інше екранується */
function rich(s) {
  const st = [];
  const o = esc(s).replace(/&lt;(\/?)(b|i|u)&gt;/gi, (m, c, t) => {
    t = t.toLowerCase();
    if (!c) { st.push(t); return '<' + t + '>'; }
    const j = st.lastIndexOf(t); if (j < 0) return '';
    st.splice(j, 1); return '</' + t + '>';
  });
  return o + st.reverse().map(t => '</' + t + '>').join('');
}
const app = h => { $('app').innerHTML = h; window.scrollTo(0, 0); };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* повідомлення сервера (українською) -> англійською для учня */
const MSG = [
  ['Введіть ім', 'Please enter your name and select your group.'],
  ['Вас немає у списку', 'You are not on the list for this group. Please ask your teacher.'],
  ['Завдання недоступне', 'This homework is not available.'],
  ['Доступ заборонено', 'Access denied.'],
  ['вже надіслали', 'You have already submitted this homework.'],
  ['вже надіслано', 'This homework has already been submitted.'],
  ['Спочатку надішліть', 'Please submit the homework first.'],
  ['Результату ще немає', 'No result yet.'],
  ['Набір', 'This flashcard set is not available.'],
  ['Сесія', 'Please reload the page and try again.']
];
const tr = m => { m = String(m || ''); const f = MSG.find(x => m.indexOf(x[0]) >= 0); if (f) return f[1];
  return /[А-Яа-яІіЇїЄєҐґ]/.test(m) ? 'Something went wrong. Please try again or ask your teacher.' : m; };

async function api(action, data) {
  if (API.indexOf('http') !== 0) throw new Error('The site is not connected to the database yet.');
  let r;
  try { r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data || {})) }); }
  catch (e) { throw new Error('No connection to the server. Check your internet and try again.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(tr(j.error));
  return j.data;
}

/* ---------- Home ---------- */
function goHome() {
  S.task = null; $('who').textContent = '';
  app(`<section class="hero"><img class="herologo" src="${LOGO}" alt="English Hero"><h1>Welcome to English Hero!</h1>
  <p>Your online homework platform</p>
  <div class="btns"><button class="btn" onclick="studentLogin()">Student Login</button>
  <a class="btn alt" href="${TEACHER_PAGE}">Teacher Login</a></div></section>`);
}

/* ---------- Student login ---------- */
async function studentLogin(msg) {
  const saved = store.get('eh_student') || {};
  app(`<div class="card"><h2>Student Login</h2>
  <label class="f">Your first and last name</label><input type="text" id="n" value="${esc(saved.name)}" autocomplete="name">
  <label class="f">Group</label><select id="g"><option>Loading…</option></select>
  <div class="err" id="e">${esc(msg)}</div>
  <p><button class="btn full" id="go" onclick="doLogin()">Log in</button></p></div>`);
  try {
    const gs = await api('publicGroups'); if (!$('g')) return;
    $('g').innerHTML = '<option value="">— select your group —</option>' + gs.map(g => `<option ${g === saved.group ? 'selected' : ''}>${esc(g)}</option>`).join('');
  } catch (e) { if ($('e')) $('e').textContent = e.message; }
}
async function doLogin() {
  $('e').textContent = ''; $('go').disabled = true;
  try {
    const d = await api('login', { name: $('n').value, group: $('g').value });
    S.name = d.name; S.group = d.group; S.list = d.assignments; S.decks = d.decks || [];
    store.set('eh_student', { name: S.name, group: S.group });
    showList();
  } catch (e) { $('e').textContent = e.message; $('go').disabled = false; }
}

/* ---------- Homework list ---------- */
async function showList() {
  if (!S.name) return studentLogin();
  $('who').textContent = S.name + ' · ' + S.group;
  const d = await api('login', { name: S.name, group: S.group }).catch(e => null);
  if (d) { S.list = d.assignments; S.decks = d.decks || []; }
  app(`<h2>My homework</h2>` + (S.list.length ? S.list.map(a => `<div class="card row">
    <div><h3>${esc(a.title)}</h3><div class="mut">${a.deadline ? 'Deadline: ' + esc(a.deadline) : 'No deadline'}</div></div>
    <div>${a.done
      ? `<span class="tag ${a.pending ? 'warn' : ''}">${a.pending ? 'Pending teacher check' : a.percent + '%'}</span> <button class="btn alt" onclick="openResult('${a.id}')">Result</button>`
      : `<button class="btn" onclick="openTask('${a.id}')">Start</button>`}</div></div>`).join('')
    : '<div class="card mut">There is no homework for your group yet.</div>') +
    ((S.decks || []).length ? '<h2 style="margin-top:28px">Flashcards</h2>' + S.decks.map(d => `<div class="card row"><div><h3>${esc(d.title)}</h3><div class="mut">${d.count} cards</div></div><button class="btn" onclick="openDeck('${d.id}')">Study</button></div>`).join('') : '') +
    `<p><button class="btn alt" onclick="logout()">Log out</button></p>`);
}
function logout() { S.name = ''; S.group = ''; store.del('eh_student'); goHome(); }

/* ---------- Doing the homework ---------- */
async function openTask(id) {
  app('<div class="card mut">Loading…</div>');
  try {
    const d = await api('task', { name: S.name, group: S.group, assignmentId: id });
    S.task = d; const dr = store.get('eh_draft_' + S.name + id) || {};
    S.ans = dr.ans || {}; S.ord = dr.ord || {};
    renderTask();
  } catch (e) { app(`<div class="card err">${esc(e.message)}</div><button class="btn alt" onclick="showList()">Back</button>`); }
}
const saveDraft = () => store.set('eh_draft_' + S.name + S.task.assignmentId, { ans: S.ans, ord: S.ord });
function setAns(k, v) { S.ans[k] = v; saveDraft(); prog(); }
function prog() {
  if (!$('pg')) return;
  const n = Object.keys(S.ans).filter(k => String(S.ans[k]).trim()).length;
  $('pg').textContent = n + ' / ' + S.total; $('pb').style.width = (S.total ? Math.min(100, n / S.total * 100) : 0) + '%';
}

function media(url, kind) {
  if (!url) return '';
  const m = String(url).match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (kind === 'audio') return m ? `<iframe src="https://drive.google.com/file/d/${m[1]}/preview" style="width:100%;height:90px;border:0"></iframe>` : `<audio controls style="width:100%" src="${esc(url)}"></audio>`;
  return `<img class="pic" src="${m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200' : esc(url)}" alt="">`;
}
const head = (s, si) => `<h3>${esc(s.title || 'Exercise ' + (si + 1))}</h3>${s.instructions ? `<div class="mut">${rich(s.instructions)}</div>` : ''}`;

function renderTask() {
  const hw = S.task.hw;
  S.total = hw.sections.reduce((a, s) => a + s.items.length, 0);
  app(`<h2>${esc(hw.title)}</h2><div class="mut" style="margin-bottom:12px">${S.task.deadline ? 'Deadline: ' + esc(S.task.deadline) : ''}</div>` +
    hw.sections.map((s, si) => `<div class="card">${head(s, si)}
      ${s.type === 'cloze' ? '' : (s.text ? `<div class="txt">${rich(s.text)}</div>` : '')}${media(s.imageUrl, 'img')}${media(s.audioUrl, 'audio')}
      ${s.type === 'cloze' ? clozeHTML(s, si) : s.items.map((it, i) => itemHTML(s, si, it, i)).join('')}</div>`).join('') +
    `<div class="bar"><div class="mut">Answered: <b id="pg"></b></div><div class="prog"><i id="pb"></i></div><div class="err" id="e"></div><button class="btn full" id="sb" onclick="submitTask()">Submit homework</button></div>`);
  hw.sections.forEach((s, si) => { if (s.type === 'order') s.items.forEach((it, i) => drawOrd(si + '.' + i, si, i)); });
  prog();
}

function clozeHTML(s, si) {
  return '<div class="cloze">' + rich(String(s.text)).split(/\{\{(\d+)\}\}/).map((part, n) => {
    if (n % 2 === 0) return part;
    const k = si + '.' + part;
    return `<input type="text" class="gap" placeholder="${Number(part) + 1}" value="${esc(S.ans[k] || '')}" oninput="setAns('${k}',this.value)" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }).join('') + '</div>';
}
function itemHTML(s, si, it, i) {
  const k = si + '.' + i, v = S.ans[k] || '';
  let body;
  if (s.type === 'match')
    body = `<select onchange="setAns('${k}',this.value)"><option value="">— choose —</option>${s.rights.map(r => `<option ${r === v ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>`;
  else if (s.type === 'order') body = `<div id="o${k}"></div>`;
  else if (it.options)
    body = it.options.map((o, n) => `<label class="opt"><input type="radio" name="r${k}" ${o === v ? 'checked' : ''} onchange="setAns('${k}',S.task.hw.sections[${si}].items[${i}].options[${n}])">${esc(o)}</label>`).join('');
  else if (s.type === 'open' || s.type === 'translation' || s.type === 'transform')
    body = `<textarea oninput="setAns('${k}',this.value)">${esc(v)}</textarea>`;
  else body = `<input type="text" value="${esc(v)}" oninput="setAns('${k}',this.value)" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  const q = s.type === 'order' ? 'Put the words in the correct order:' : it.q;
  return `<div class="q"><div class="qt"><b>${i + 1}.</b> ${rich(q)}</div>${body}</div>`;
}

function drawOrd(k, si, i) {
  const words = S.task.hw.sections[si].items[i].words, ch = S.ord[k] || [];
  $('o' + k).innerHTML = `<div class="chosen">${ch.map((w, n) => `<span class="chip" onclick="ordUndo('${k}',${si},${i},${n})">${esc(words[w])}</span>`).join('')}</div>` +
    words.map((w, n) => `<span class="chip ${ch.indexOf(n) >= 0 ? 'used' : ''}" onclick="ordAdd('${k}',${si},${i},${n})">${esc(w)}</span>`).join('');
}
function ordAdd(k, si, i, n) { (S.ord[k] = S.ord[k] || []).push(n); ordSync(k, si, i); }
function ordUndo(k, si, i, pos) { S.ord[k].splice(pos, 1); ordSync(k, si, i); }
function ordSync(k, si, i) {
  const w = S.task.hw.sections[si].items[i].words;
  S.ans[k] = S.ord[k].map(n => w[n]).join(' '); saveDraft(); drawOrd(k, si, i); prog();
}

async function submitTask() {
  const done = Object.keys(S.ans).filter(k => String(S.ans[k]).trim()).length;
  if (done < S.total && !confirm(`You answered ${done} of ${S.total} questions. Submit anyway?`)) return;
  $('sb').disabled = true; $('e').textContent = '';
  try {
    const r = await api('submit', { name: S.name, group: S.group, assignmentId: S.task.assignmentId, answers: S.ans });
    store.del('eh_draft_' + S.name + S.task.assignmentId);
    showResult(r, S.task.hw);
  } catch (e) { $('e').textContent = e.message; $('sb').disabled = false; }
}

/* ---------- Result: помилки показуються прямо в тексті вправ ---------- */
async function openResult(id) {
  app('<div class="card mut">Loading…</div>');
  try {
    const [r, t] = await Promise.all([
      api('myResult', { name: S.name, group: S.group, assignmentId: id }),
      api('resultView', { name: S.name, group: S.group, assignmentId: id }).catch(() => null)
    ]);
    showResult(r, t && t.hw);
  } catch (e) { app(`<div class="card err">${esc(e.message)}</div><button class="btn alt" onclick="showList()">Back</button>`); }
}
function ansChip(d) {
  if (!d) return '';
  const g = d.given ? esc(d.given) : '';
  if (d.manual) return `<span class="a man">${g || '—'}</span>`;
  if (d.ok) return `<span class="a ok">✓ ${g}</span>`;
  return `<span class="a bad">${g ? '<s>' + g + '</s>' : '&nbsp;&nbsp;&nbsp;'}</span><span class="a fix">${esc(d.correct)}</span>`;
}
function reviewItem(s, si, it, i, d) {
  if (!d) return '';
  const num = `<b>${i + 1}.</b> `;
  if (it.options) {
    const opts = it.options.map(o => {
      const mine = o === d.given, right = !d.ok && !d.manual && o === d.correct;
      const c = 'ro' + (mine ? (d.ok ? ' ok' : d.manual ? ' man' : ' bad') : right ? ' fix' : '');
      return `<div class="${c}">${mine ? (d.ok ? '✓ ' : d.manual ? '' : '✗ ') : right ? '✓ ' : ''}${esc(o)}</div>`;
    }).join('');
    return `<div class="q"><div class="qt">${num}${rich(it.q)}</div>${opts}${!d.given && !d.manual ? '<div class="err">No answer given</div>' : ''}</div>`;
  }
  if (s.type === 'match') return `<div class="q"><div class="qt">${num}${rich(it.q)} → ${ansChip(d)}</div></div>`;
  let line = s.type === 'order' ? 'Put the words in the correct order:' : rich(it.q);
  if (s.type !== 'order' && /_{2,}/.test(line)) line = line.replace(/_{2,}/, () => ansChip(d));
  else line += `<div class="ansrow">${ansChip(d)}</div>`;
  return `<div class="q"><div class="qt">${num}${line}</div>${d.manual ? '<div class="mut">Your teacher will check this answer.</div>' : ''}</div>`;
}
function reviewHTML(hw, by) {
  return hw.sections.map((s, si) => {
    const body = s.type === 'cloze'
      ? '<div class="cloze">' + rich(String(s.text)).split(/\{\{(\d+)\}\}/).map((p, n) => n % 2 === 0 ? p : ansChip(by[si + '.' + p])).join('') + '</div>'
      : s.items.map((it, i) => reviewItem(s, si, it, i, by[si + '.' + i])).join('');
    return `<div class="card">${head(s, si)}${s.type !== 'cloze' && s.text ? `<div class="txt">${rich(s.text)}</div>` : ''}${body}</div>`;
  }).join('');
}
function showResult(r, hw) {
  const by = {}; r.details.forEach(d => by[d.key] = d);
  const ok = r.details.filter(d => d.ok).length, bad = r.details.filter(d => !d.manual && !d.ok).length, man = r.details.filter(d => d.manual).length;
  const pend = r.pendingManual || r.pending;
  const msg = r.percent >= 90 ? 'Excellent work! 🌟' : r.percent >= 70 ? 'Good job! 👍' : r.percent >= 50 ? 'Not bad — review your mistakes below.' : 'Keep practising — check the mistakes below.';
  app(`<div class="card sum"><div class="mut">Your result</div><div class="big">${r.percent}%</div>
    <div>${r.score}${r.max ? ' / ' + r.max : ''} points</div><p><b>${msg}</b></p>
    <div class="legend"><span class="a ok">✓ ${ok} correct</span><span class="a bad">✗ ${bad} mistakes</span>${man ? `<span class="a man">${man} for teacher</span>` : ''}</div>
    ${pend ? '<p><span class="tag warn">Open answers will be checked by your teacher — your percentage may change</span></p>' : ''}
    ${r.comment ? `<div class="txt"><b>Teacher’s comment:</b><br>${esc(r.comment)}</div>` : ''}</div>` +
    (hw ? '<p class="mut">Your mistakes are marked in red; the correct answer is shown in green.</p>' + reviewHTML(hw, by) : '') +
    `<button class="btn" onclick="showList()">Back to my homework</button>`);
}

/* ---------- Flashcards: різні режими + озвучка (безкоштовний голос браузера) ---------- */
const F = { id: '', title: '', all: [], mode: '', queue: [], i: 0, flip: false, rev: false, wrong: [], right: 0, locked: false, opts: [], m: null, accent: store.get('eh_accent') || 'en-GB' };
const CAN_SPEAK = 'speechSynthesis' in window;
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fnorm = s => String(s == null ? '' : s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[.!?;,]+$/, '').replace(/\s+/g, ' ').trim();
const variants = s => String(s == null ? '' : s).split('|').map(x => x.trim()).filter(Boolean);
const word = c => variants(c.front)[0] || c.front;
function say(text) {
  if (!CAN_SPEAK) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(variants(text)[0] || text); u.lang = F.accent; u.rate = 0.85;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => v.lang.replace('_', '-') === F.accent) || vs.find(v => v.lang.indexOf('en') === 0);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const sayCur = () => say(F.queue[F.i].front);
const sayW = n => say(F.wrong[n].front);
const sayM = (side, n) => say(F.m.L[n].front);
function setAccent(v) { F.accent = v; store.set('eh_accent', v); }

async function openDeck(id) {
  app('<div class="card mut">Loading…</div>');
  try { const d = await api('deck', { name: S.name, group: S.group, deckId: id }); F.id = id; F.title = d.title; F.all = d.cards; deckMenu(); }
  catch (e) { app(`<div class="card err">${esc(e.message)}</div><button class="btn alt" onclick="showList()">Back</button>`); }
}
function deckMenu() {
  const modes = [
    ['flip', '🃏 Flashcards', 'Flip the cards and mark what you know'],
    ['mc', '✅ Multiple choice', 'Choose the correct translation'],
    ['type', '✍️ Type the word', 'See the translation and write the English word'],
    ['listen', '🔊 Listen & type', 'Hear the word and spell it'],
    ['match', '🧩 Matching game', 'Connect English words with translations']
  ].filter(m => CAN_SPEAK || m[0] !== 'listen');
  app(`<h2>${esc(F.title)}</h2><div class="mut">${F.all.length} cards · choose how you want to practise</div>` +
    modes.map(m => `<button class="mode" onclick="startMode('${m[0]}')"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('') +
    (CAN_SPEAK ? `<p class="mut">Voice: <select style="width:auto;padding:6px 10px" onchange="setAccent(this.value)"><option value="en-GB" ${F.accent === 'en-GB' ? 'selected' : ''}>British 🇬🇧</option><option value="en-US" ${F.accent === 'en-US' ? 'selected' : ''}>American 🇺🇸</option></select></p>` : '') +
    `<p><button class="btn alt" onclick="showList()">Back to my homework</button></p>`);
}
function startMode(m, cards) {
  const src = (cards || F.all).slice();
  F.mode = m; F.queue = shuf(src); F.i = 0; F.wrong = []; F.right = 0; F.flip = false; F.locked = false; F.m = null;
  if (m === 'match') return matchRound();
  drawQ();
}
function nextQ() { F.i++; F.flip = false; F.locked = false; drawQ(); }

function drawQ() {
  if (F.i >= F.queue.length) return finishMode();
  const c = F.queue[F.i];
  const head = `<div class="row"><h2>${esc(F.title)}</h2><span class="tag">${F.i + 1} / ${F.queue.length}</span></div><div class="prog"><i style="width:${F.i / F.queue.length * 100}%"></i></div>`;
  const foot = `<p class="mut"><a href="#" onclick="deckMenu();return false">Change mode</a></p>`;
  const spk = CAN_SPEAK ? '<button class="spk" onclick="event.stopPropagation();sayCur()" title="Listen">🔊</button>' : '';
  if (F.mode === 'flip') {
    const front = F.rev ? c.back : c.front, back = F.rev ? c.front : c.back;
    app(head + `<div class="fc" onclick="F.flip=!F.flip;drawQ()"><div class="fcw">${esc(F.flip ? back : front)}</div>${F.flip && c.example ? `<div class="mut">${esc(c.example)}</div>` : ''}${F.flip ? '' : '<div class="mut">Tap the card to reveal the answer</div>'}${spk}</div>` +
      (F.flip ? `<div class="row"><button class="btn alt" style="flex:1" onclick="F.wrong.push(F.queue[F.i]);nextQ()">Still learning</button><button class="btn" style="flex:1" onclick="F.right++;nextQ()">I know it</button></div>` : '<button class="btn full" onclick="F.flip=true;drawQ()">Show answer</button>') +
      `<p class="mut"><a href="#" onclick="F.rev=!F.rev;F.flip=false;drawQ();return false">Direction: ${F.rev ? 'UA → EN' : 'EN → UA'} (change)</a> · <a href="#" onclick="deckMenu();return false">Change mode</a></p>`);
  } else if (F.mode === 'mc') {
    const seen = {}; seen[fnorm(c.back)] = 1; const pool = [];
    shuf(F.all).forEach(x => { const k = fnorm(x.back); if (!seen[k] && pool.length < 3) { seen[k] = 1; pool.push(x.back); } });
    F.opts = shuf([c.back].concat(pool));
    app(head + `<div class="card sum"><div class="fcw">${esc(word(c))}</div>${spk}<p class="mut">Choose the correct translation</p></div>` +
      F.opts.map((o, n) => `<button class="tile left" id="mo${n}" onclick="pickMC(${n})">${esc(o)}</button>`).join('') + `<div id="fb"></div>` + foot);
  } else {   // type | listen
    const listen = F.mode === 'listen';
    app(head + `<div class="card sum">${listen ? '<button class="spk big" onclick="sayCur()" title="Listen again">🔊</button><p class="mut">Listen and type the word you hear</p>' : `<div class="fcw">${esc(c.back)}</div><p class="mut">Type the English word</p>`}</div>
      <input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkType()"><div id="fb" style="margin-top:12px"></div>
      <p><button class="btn full" id="tb" onclick="checkType()">Check</button></p>` + foot);
    if (listen) setTimeout(() => { if (F.mode === 'listen' && F.queue[F.i] === c) sayCur(); }, 350);
    $('ti').focus();
  }
}
function pickMC(n) {
  if (F.locked) return; F.locked = true;
  const c = F.queue[F.i], ok = F.opts[n] === c.back;
  F.opts.forEach((o, m) => { const b = $('mo' + m); if (!b) return; if (o === c.back) b.classList.add('ok'); else if (m === n) b.classList.add('bad'); });
  if (ok) { F.right++; setTimeout(() => { if (F.mode === 'mc' && F.queue[F.i] === c && F.locked) nextQ(); }, 700); }
  else { F.wrong.push(c); $('fb').innerHTML = '<button class="btn full" style="margin-top:10px" onclick="nextQ()">Next</button>'; }
}
function checkType() {
  if (F.locked) return nextQ();
  const c = F.queue[F.i], val = $('ti').value.trim();
  const ok = !!fnorm(val) && variants(c.front).some(v => fnorm(v) === fnorm(val));
  F.locked = true; ok ? F.right++ : F.wrong.push(c);
  $('ti').readOnly = true; $('tb').textContent = 'Next';
  $('fb').innerHTML = (ok ? '<span class="a ok">✓ Correct!</span>' : `<span class="a bad"><s>${esc(val) || '—'}</s></span><span class="a fix">${esc(variants(c.front).join(' / '))}</span>`) +
    (F.mode === 'listen' ? `<div class="mut" style="margin-top:6px">${esc(c.back)}</div>` : '');
}

/* matching game: раунди по 6 пар */
function matchRound() {
  if (F.i >= F.queue.length) return finishMode();
  const pairs = F.queue.slice(F.i, F.i + 6);
  F.m = { pairs, L: shuf(pairs), R: shuf(pairs), done: [], sel: null, flash: null };
  drawMatch(true);
}
function drawMatch(scroll) {
  const m = F.m, cls = (side, c) => m.done.indexOf(c) >= 0 ? 'done' : (m.flash && m.flash[side] === c) ? 'bad' : (m.sel && m.sel.side === side && m.sel.c === c) ? 'sel' : '';
  const h = `<div class="row"><h2>${esc(F.title)}</h2><span class="tag">${Math.min(F.i + m.done.length, F.queue.length)} / ${F.queue.length}</span></div><div class="prog"><i style="width:${(F.i + m.done.length) / F.queue.length * 100}%"></i></div>
    <p class="mut">Tap a word, then tap its translation.</p><div class="cols"><div>${m.L.map((c, n) => `<button class="tile ${cls('L', c)}" onclick="tapM('L',${n})">${esc(word(c))}</button>`).join('')}</div>
    <div>${m.R.map((c, n) => `<button class="tile ${cls('R', c)}" onclick="tapM('R',${n})">${esc(c.back)}</button>`).join('')}</div></div>
    <p class="mut"><a href="#" onclick="deckMenu();return false">Change mode</a></p>`;
  if (scroll) app(h); else $('app').innerHTML = h;
}
function tapM(side, n) {
  const m = F.m; if (m.flash) return;
  const c = (side === 'L' ? m.L : m.R)[n]; if (m.done.indexOf(c) >= 0) return;
  if (side === 'L') say(c.front);
  if (!m.sel || m.sel.side === side) { m.sel = { side, c }; return drawMatch(); }
  const left = side === 'L' ? c : m.sel.c, right = side === 'R' ? c : m.sel.c; m.sel = null;
  if (left === right) {
    m.done.push(left); drawMatch();
    if (m.done.length === m.pairs.length) setTimeout(() => { if (F.m === m && F.mode === 'match') { F.i += m.pairs.length; matchRound(); } }, 700);
  } else {
    if (F.wrong.indexOf(left) < 0) F.wrong.push(left);
    m.flash = { L: left, R: right }; drawMatch();
    setTimeout(() => { if (F.m === m) { m.flash = null; drawMatch(); } }, 650);
  }
}

function finishMode() {
  const total = F.queue.length, ok = total - F.wrong.length, pct = total ? Math.round(ok / total * 100) : 0;
  app(`<div class="card sum"><h2>${F.wrong.length ? 'Well done!' : 'Perfect! 🎉'}</h2><div class="big">${pct}%</div><p>${ok} / ${total} correct</p></div>` +
    (F.wrong.length ? `<div class="card"><h3>Words to review</h3>${F.wrong.map((c, n) => `<div class="q row"><span><b>${esc(word(c))}</b> — ${esc(c.back)}</span>${CAN_SPEAK ? `<button class="spk" onclick="sayW(${n})">🔊</button>` : ''}</div>`).join('')}</div>
      <p><button class="btn full" onclick="startMode(F.mode, F.wrong.slice())">Practise these words again</button></p>` : '') +
    '<p><button class="btn alt full" onclick="deckMenu()">Choose another mode</button></p><p><button class="btn alt full" onclick="showList()">Back to my homework</button></p>');
}

goHome();
</script>
</body>
</html>
